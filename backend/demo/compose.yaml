name: askdb-demo-v0
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${ASKDB_ADMIN_PASSWORD:?Defina ASKDB_ADMIN_PASSWORD}
      ASKDB_READER_PASSWORD: ${ASKDB_READER_PASSWORD:?Defina ASKDB_READER_PASSWORD}
    ports:
      - "127.0.0.1:${ASKDB_DEMO_POSTGRES_PORT:-5434}:5432"
    volumes:
      - demo_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "demo_estoque"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  demo_data:
