name: askdb-marco20
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: askdb
      POSTGRES_PASSWORD: ${ASKDB_ADMIN_PASSWORD:?Defina ASKDB_ADMIN_PASSWORD}
      ASKDB_READER_PASSWORD: ${ASKDB_READER_PASSWORD:?Defina ASKDB_READER_PASSWORD}
    ports:
      - "127.0.0.1:${ASKDB_POSTGRES_PORT:-5433}:5432"
    volumes:
      - askdb_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askdb"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  askdb_data:
